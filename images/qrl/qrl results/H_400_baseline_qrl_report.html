const COLORS = {"800": {"bg": "#BDD7EE", "bd": "#1F4E79"}, "600": {"bg": "#C6E0B4", "bd": "#375623"}, "400": {"bg": "#F8CBAD", "bd": "#C55A11"}, "800_6c": {"bg": "#BDD7EE", "bd": "#1F4E79"}, "800_2c": {"bg": "#9DC3E6", "bd": "#1F4E79"}, "600_4c": {"bg": "#C6E0B4", "bd": "#375623"}, "600_2c": {"bg": "#A9D08E", "bd": "#375623"}, "400_2c": {"bg": "#F8CBAD", "bd": "#C55A11"}, "QUI": {"bg": "#F2F2F2", "bd": "#7F7F7F"}, "RM": {"bg": "#F2F2F2", "bd": "#7F7F7F"}};
const PROPS = [{"key": "P", "label": "P", "unit": "bar"}, {"key": "T", "label": "T", "unit": "K"}, {"key": "h", "label": "h", "unit": "J/g"}, {"key": "m", "label": "m_dot", "unit": "g/s"}, {"key": "dm", "label": "dm_node", "unit": "g/s"}, {"key": "v", "label": "v", "unit": "m/s"}, {"key": "rho", "label": "rho", "unit": "kg/m3"}, {"key": "flash", "label": "flash", "unit": "%"}];
const SUMMARY = {"C": {"D_mm": 134.5, "std": "DN125, EN OD 139.7 x 2.6", "m_qui": 1955.861144483414, "dP_mbar": 64.6255482404623, "v_max": 1.0706014749986452, "budget_mbar": 130.0, "ok": true}, "D": {"D_mm": 213.9, "std": "DN200, EN OD 219.1 x 2.6", "m_qui": 1918.901721983415, "dP_mbar": 33.211871070742525, "v_max": 2.5047252145079932, "budget_mbar": 70.0, "ok": true}, "A": {"D_mm": 84.9, "std": "DN80, EN OD 88.9 x 2.0", "m_qui": 513.3696268139662, "dP_mbar": 13.462674389169926, "v_max": 0.6101230195675059, "budget_mbar": 25.0, "ok": true}, "B": {"D_mm": 347.6, "std": "DN350, EN OD 355.6 x 4.0", "m_qui": 513.3696268139662, "dP_mbar": 1.7899784668879217, "v_max": 7.798470345307431, "budget_mbar": 3.0, "ok": true}, "E": {"D_mm": 110.3, "std": "DN100, EN OD 114.3 x 2.0", "m_qui": 1271.1977410719703, "dP_mbar": 376.4850259640937, "v_max": 7.096693585577144, "budget_mbar": 600.0, "ok": true}, "F": {"D_mm": 110.3, "std": "DN100, EN OD 114.3 x 2.0", "m_qui": 1271.1977410719703, "dP_mbar": 530.3194398100342, "v_max": 10.272221578004784, "budget_mbar": 600.0, "ok": true}};
const BUDGETS_TEXT = "accepted dP budgets [mbar]:  A \u2264 25   B \u2264 3   C \u2264 130   D \u2264 70   E \u2264 600   F \u2264 600";
document.getElementById("budgets").textContent = BUDGETS_TEXT;
let current = Object.keys(DATA.lines)[0];

function fmt(v) {
  if (v === null || v === undefined) return "&mdash;";
  const a = Math.abs(v);
  if (a >= 100) return v.toFixed(1);
  if (a >= 10)  return v.toFixed(2);
  if (a >= 1)   return v.toFixed(3);
  return v.toFixed(4);
}

function render() {
  const strip = document.getElementById("strip");
  const L = DATA.lines[current];
  let html = "";
  for (let i = 0; i < DATA.x.length; i++) {
    const t = DATA.type[i];
    const isEnd = (t === "QUI" || t === "RM");
    const c = COLORS[t] || {bg: "#EEEEEE", bd: "#888888"};
    const dm = L.dm ? L.dm[i] : null;
    const dim = (!isEnd && (dm === null || dm === undefined || Math.abs(dm) < 1e-9));
    let vals = "";
    for (const p of PROPS) {
      vals += '<div><span class="k">' + p.label + ' = </span><span class="v">' +
              fmt(L[p.key][i]) + "</span></div>";
    }
    html += '<div class="col' + (isEnd ? " end" : "") + (dim ? " dim" : "") + '">' +
            '<div class="vals">' + vals + "</div>" +
            '<div class="pipe"></div>' +
            '<div class="stub' + (isEnd ? " none" : "") + '"></div>' +
            '<div class="box" style="background:' + c.bg + ";border-color:" + c.bd + '">' + t + "</div>" +
            '<div class="idx">idx ' + i + " &middot; x=" + DATA.x[i] + " m</div>" +
            "</div>";
  }
  strip.innerHTML = html;
  document.getElementById("units").innerHTML =
    "Line <b>" + current + "</b> &mdash; " +
    PROPS.map(p => p.label + " [" + p.unit + "]").join(" &nbsp;&middot;&nbsp; ");

  const s = SUMMARY[current] || {};
  let sum = [];
  if (s.D_mm !== null && s.D_mm !== undefined) {
    let d = "D = " + s.D_mm.toFixed(1) + " mm";
    if (s.std) d += " (" + s.std + ")";
    sum.push(d);
  }
  if (s.m_qui !== null && s.m_qui !== undefined) sum.push("m_QUI = " + s.m_qui.toFixed(1) + " g/s");
  if (s.dP_mbar !== null && s.dP_mbar !== undefined) {
    let dp = "&Delta;P = " + s.dP_mbar.toFixed(3) + " mbar";
    if (s.budget_mbar !== null && s.budget_mbar !== undefined) {
      dp += s.ok ? ' (budget &le; ' + s.budget_mbar + ' &rarr; <b style="color:#0F6E56">PASS</b>)'
                 : ' (budget &le; ' + s.budget_mbar + ' &rarr; <b style="color:#C0392B">FAIL</b>)';
    }
    sum.push(dp);
  }
  if (s.v_max !== null && s.v_max !== undefined) sum.push("v_max = " + s.v_max.toFixed(2) + " m/s");
  document.getElementById("linesum").innerHTML = sum.join(" &nbsp;&middot;&nbsp; ");
  document.querySelectorAll("#btns button").forEach(b =>
    b.classList.toggle("active", b.dataset.line === current));
}

const btns = document.getElementById("btns");
for (const k of Object.keys(DATA.lines)) {
  const b = document.createElement("button");
  b.textContent = "Line " + k;
  b.dataset.line = k;
  b.onclick = () => { current = k; render(); };
  btns.appendChild(b);
}
render();
